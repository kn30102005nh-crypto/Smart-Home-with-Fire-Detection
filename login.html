<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Nhập & Đăng Ký — HCMUTE IoT</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      FacebookAuthProvider, 
      GoogleAuthProvider,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAvb_FDoSynGx59kNCGG59zMZgihk60ULk",
    authDomain: "tt-iot-427aa.firebaseapp.com",
    databaseURL: "https://tt-iot-427aa-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tt-iot-427aa",
    storageBucket: "tt-iot-427aa.firebasestorage.app",
    messagingSenderId: "199545600596",
    appId: "1:199545600596:web:a56b6559c413e7722e4bc1",
    measurementId: "G-842H2HYZCR"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
  window.auth = auth;
  window.FacebookAuthProvider = FacebookAuthProvider;
  window.GoogleAuthProvider = GoogleAuthProvider;
  window.signInWithPopup = signInWithPopup;
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.setPersistence = setPersistence;
  window.browserLocalPersistence = browserLocalPersistence;
  window.browserSessionPersistence = browserSessionPersistence;
</script>

<style>
    /* FONT CHỮ */
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap');

    body {
        font-family: 'Be Vietnam Pro', sans-serif;
        overflow: hidden;
        background-image: url('https://d15shllkswkct0.cloudfront.net/wp-content/blogs.dir/1/files/2025/01/Image-Smart-Home-OnQ-Blog.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        position: relative;
        margin: 0; padding: 0;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    }

    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
    }

    .container {
        background-color: #fff;
        border-radius: 20px;
        box-shadow: 0 14px 28px rgba(0,0,0,0.3), 
                    0 10px 10px rgba(0,0,0,0.25);
        position: relative;
        overflow: hidden;
        width: 900px;
        max-width: 100%;
        min-height: 600px;
    }

    .form-container {
        position: absolute;
        top: 0;
        height: 100%;
        transition: all 0.6s ease-in-out;
    }

    form {
        background-color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0 30px; 
        height: 100%;
        text-align: center;
    }

    /* Logo Animation */
    @keyframes floatLogo {
        0% { transform: translateY(0px); filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); }
        50% { transform: translateY(-6px); filter: drop-shadow(0 8px 8px rgba(0,0,0,0.15)); }
        100% { transform: translateY(0px); filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); }
    }

    .uni-logo {
        width: 80px;
        height: auto;
        margin-bottom: 5px;
        animation: floatLogo 3s ease-in-out infinite;
        transition: transform 0.3s ease, filter 0.3s ease;
    }
    .uni-logo:hover {
        transform: scale(1.05) translateY(-6px);
        filter: drop-shadow(0 10px 10px rgba(37, 99, 235, 0.3));
    }

    h1 {
        font-weight: 800;
        margin-bottom: 10px;
        font-size: 1.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        line-height: 1.2;
    }

    /* Tiêu đề Đăng Nhập / Đăng Ký */
    .sign-in-title {
        background: linear-gradient(to right, #2563eb, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 4px rgba(37, 99, 235, 0.2));
        padding-bottom: 5px; margin-top: 5px;
    }

    .sign-up-title {
        background: linear-gradient(to right, #8e2de2, #ff512f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 4px rgba(142, 45, 226, 0.2));
        padding-bottom: 5px; margin-top: 5px;
    }

    input {
        background-color: #f4f8f7;
        border: 2px solid transparent;
        padding: 12px 15px;
        margin: 8px 0;
        width: 100%;
        border-radius: 10px;
        outline: none;
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 0.9rem; font-weight: 600;
        color: #333; transition: 0.3s;
    }
    input::placeholder { color: #888; font-weight: 500; font-size: 0.85rem; }
    input:focus { background-color: #fff; border-color: #2a5298; box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1); }

    .options-row {
        display: flex; justify-content: space-between; align-items: center;
        width: 100%; margin: 10px 0 20px 0;
        font-size: 0.85rem; font-weight: 600; color: #555;
    }

    .remember-me { display: flex; align-items: center; cursor: pointer; user-select: none; gap: 6px; }
    .remember-me input { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: #2a5298; }

    .forgot-link { color: #2a5298; text-decoration: none; transition: 0.2s; font-weight: 700; font-size: 0.85rem; }
    .forgot-link:hover { text-decoration: underline; color: #1e3c72; }

    /* Button */
    button.action-btn {
        border-radius: 50px; border: none;
        background: linear-gradient(to right, #1e3c72, #2a5298);
        color: #FFFFFF; font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 13px; font-weight: 700;
        padding: 12px 45px; letter-spacing: 1px;
        text-transform: uppercase; transition: transform 80ms ease-in, box-shadow 0.3s;
        cursor: pointer; box-shadow: 0 5px 15px rgba(30, 60, 114, 0.2);
        width: 100%; max-width: 200px;
    }
    button.action-btn:active { transform: scale(0.95); }
    button.action-btn:hover { box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4); transform: translateY(-2px); }

    button.ghost {
        background: transparent; border: 2px solid #FFFFFF;
        margin-top: 20px; box-shadow: none; font-weight: 700;
    }
    button.ghost:hover { background: rgba(255,255,255,0.2); }

    .divider {
        display: flex; align-items: center; width: 100%;
        margin: 20px 0 15px 0; color: #888; font-size: 0.8rem; font-weight: 600;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #eee; }
    .divider span { margin: 0 10px; }

    .social-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; }
    .social-icon {
        height: 40px; width: 40px;
        display: flex; justify-content: center; align-items: center;
        border: 1px solid #e1e1e1; border-radius: 50%;
        color: #333; text-decoration: none; transition: 0.3s;
        background: #fff; cursor: pointer; overflow: hidden;
    }
    .social-icon:hover {
        background-color: #fff; transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-color: #bbb;
    }
    .social-icon svg { width: 20px; height: 20px; }
    .social-logo-img { width: 22px; height: 22px; object-fit: contain; }

    /* Sliding Animation Logic */
    .sign-in-container { left: 0; width: 50%; z-index: 2; }
    .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }

    .container.right-panel-active .sign-in-container { transform: translateX(100%); }
    .container.right-panel-active .sign-up-container { 
        transform: translateX(100%); opacity: 1; z-index: 5; animation: show 0.6s; 
    }
    
    @keyframes show {
        0%, 49.99% { opacity: 0; z-index: 1; }
        50%, 100% { opacity: 1; z-index: 5; }
    }

    .overlay-container {
        position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
        overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100;
        border-top-left-radius: 100px; border-bottom-left-radius: 100px;
    }
    .container.right-panel-active .overlay-container {
        transform: translateX(-100%);
        border-top-left-radius: 0; border-bottom-left-radius: 0;
        border-top-right-radius: 100px; border-bottom-right-radius: 100px;
    }

    .overlay {
        background: #1e3c72;
        background: -webkit-linear-gradient(to right, #2a5298, #1e3c72);
        background: linear-gradient(to right, #2a5298, #1e3c72);
        background-repeat: no-repeat; background-size: cover; background-position: 0 0;
        color: #FFFFFF; position: relative; left: -100%; height: 100%; width: 200%;
        transform: translateX(0); transition: transform 0.6s ease-in-out;
    }
    .container.right-panel-active .overlay { transform: translateX(50%); }

    .overlay-panel {
        position: absolute; display: flex; align-items: center; justify-content: center;
        flex-direction: column; padding: 0 40px; text-align: center;
        top: 0; height: 100%; width: 50%; 
        transform: translateX(0);
        transition: transform 0.6s ease-in-out; 
    }
    
    .overlay-panel h1 {
        color: #fff; background: none; -webkit-text-fill-color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 1.8rem; margin-bottom: 10px;
    }
    
    /* --- ĐÃ SỬA: CĂN GIỮA VĂN BẢN (TEXT ALIGNMENT) --- */
    .overlay-panel p {
        font-size: 0.9rem;
        font-weight: 500;
        line-height: 1.6;
        letter-spacing: 0.5px;
        /* Canh giữa tuyệt đối */
        margin: 20px auto 30px auto; 
        max-width: 320px; /* Giới hạn chiều rộng để chữ tự ngắt dòng đẹp hơn */
        width: 100%;
        text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .highlight-text {
        color: #FFD700; font-weight: 700; text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Vị trí chữ ban đầu */
    .overlay-left { transform: translateX(-20%); } 
    .container.right-panel-active .overlay-left { transform: translateX(0); }

    .overlay-right { right: 0; transform: translateX(0); }
    .container.right-panel-active .overlay-right { transform: translateX(20%); }

    /* Highlight Effect */
    @keyframes popBounce {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }
    .pop-effect {
        position: relative; display: inline-block;
        animation: popBounce 1s ease-in-out infinite; animation-delay: 0.6s;
        text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    .pop-effect::before {
        content: ''; position: absolute;
        top: 50%; left: -5px; right: -5px; height: 40%;
        background-color: rgba(255, 223, 0, 0.8); z-index: -1;
        transform: translateY(-20%) rotate(-2deg);
        border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #msgBox {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        padding: 12px 25px; border-radius: 30px; color: white; font-weight: bold;
        display: none; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        font-family: 'Be Vietnam Pro', sans-serif;
    }
</style>
</head>
<body>

    <div id="msgBox"></div>

    <div class="login-wrapper">
        <div class="container" id="container">
            
            <div class="form-container sign-up-container">
                <form action="#" onsubmit="return false;">
                    <img src="https://iconape.com/wp-content/png_logo_vector/hcmute-logo.png" alt="HCMUTE Logo" class="uni-logo">
                    
                    <h1 class="sign-up-title">Tạo Tài Khoản</h1>
                    
                    <input type="email" id="regEmail" placeholder="Email của bạn" />
                    <input type="password" id="regPassword" placeholder="Mật khẩu (Tối thiểu 6 ký tự)" />
                    <input type="password" id="regConfirmPassword" placeholder="Nhập lại mật khẩu" />
                    
                    <button class="action-btn" onclick="registerUser()">Đăng Ký</button>

                    <div class="divider"><span>Hoặc đăng ký với</span></div>
                    
                    <div class="social-container">
                        <a onclick="loginWithFacebook()" class="social-icon" title="Facebook">
                             <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.15 5.96C15.21 5.96 16.12 6.04 16.12 6.04V8.51H15.01C13.77 8.51 13.38 9.28 13.38 10.07V12.06H16.16L15.72 14.96H13.38V21.96C18.16 21.21 21.82 17.06 21.82 12.06C21.82 6.53 17.32 2.04 12 2.04Z"/></svg>
                        </a>
                        <a onclick="loginWithGoogle()" class="social-icon" title="Google">
                             <img src="https://freelogopng.com/images/all_img/1657952440google-logo-png-transparent.png" alt="Google" class="social-logo-img">
                        </a>
                    </div>
                </form>
            </div>

            <div class="form-container sign-in-container">
                <form action="#" onsubmit="return false;">
                    <img src="https://iconape.com/wp-content/png_logo_vector/hcmute-logo.png" alt="HCMUTE Logo" class="uni-logo">

                    <h1 class="sign-in-title">Đăng Nhập</h1>
                    
                    <input type="email" id="loginEmail" placeholder="Email" />
                    <input type="password" id="loginPassword" placeholder="Mật khẩu" />
                    
                    <div class="options-row">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Ghi nhớ</span>
                        </label>
                        <a href="#" class="forgot-link">Quên mật khẩu?</a>
                    </div>
                    
                    <button class="action-btn" onclick="loginUser()">Đăng Nhập</button>

                    <div class="divider"><span>Hoặc tiếp tục với</span></div>

                    <div class="social-container">
                        <a onclick="loginWithFacebook()" class="social-icon" title="Facebook">
                            <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.15 5.96C15.21 5.96 16.12 6.04 16.12 6.04V8.51H15.01C13.77 8.51 13.38 9.28 13.38 10.07V12.06H16.16L15.72 14.96H13.38V21.96C18.16 21.21 21.82 17.06 21.82 12.06C21.82 6.53 17.32 2.04 12 2.04Z"/></svg>
                        </a>
                        <a onclick="loginWithGoogle()" class="social-icon" title="Google">
                            <img src="https://freelogopng.com/images/all_img/1657952440google-logo-png-transparent.png" alt="Google" class="social-logo-img">
                        </a>
                    </div>
                </form>
            </div>

            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1><span class="pop-effect">Chào mừng!</span></h1>
                        <p>
                            Hệ thống <span class="highlight-text">IoT</span> giám sát an toàn trường <span class="highlight-text">ĐH Sư Phạm Kỹ Thuật TP.HCM</span>.
                        </p>
                        <button class="action-btn ghost" id="signIn">Đăng Nhập</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1><span class="pop-effect">Bạn mới đến đây?</span></h1>
                        <p>
                            Đăng ký tài khoản để bắt đầu quản lý hệ thống của bạn <span class="highlight-text">ngay hôm nay</span>.
                        </p>
                        <button class="action-btn ghost" id="signUp">Đăng Ký</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- GIAO DIỆN ---
    function showMsg(text, type) {
        const msg = document.getElementById('msgBox');
        msg.textContent = text;
        msg.style.display = 'block';
        msg.style.backgroundColor = type === 'success' ? '#28a745' : '#dc3545';
        setTimeout(() => msg.style.display = 'none', 3000);
    }

    function setLoading(isLoading) {
        const btns = document.querySelectorAll('button.action-btn:not(.ghost)');
        btns.forEach(btn => {
            btn.style.opacity = isLoading ? 0.7 : 1;
            btn.innerHTML = isLoading ? '<div style="width:16px;height:16px;border:2px solid #fff;border-top:2px solid transparent;border-radius:50%;animation:spin 1s linear infinite;display:inline-block;"></div>' : (btn.onclick.name === 'loginUser' ? 'Đăng Nhập' : 'Đăng Ký');
            btn.disabled = isLoading;
        });
    }

    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('container');

    signUpButton.addEventListener('click', () => container.classList.add("right-panel-active"));
    signInButton.addEventListener('click', () => container.classList.remove("right-panel-active"));

    // --- FIREBASE LOGIC ---
    
    // Đăng nhập với tính năng Ghi nhớ
    async function loginUser() {
        const email = document.getElementById("loginEmail").value.trim();
        const pass = document.getElementById("loginPassword").value;
        const remember = document.getElementById("rememberMe").checked; 

        if (!email || !pass) return showMsg("Vui lòng nhập đủ thông tin!", "error");

        setLoading(true);
        try {
            await window.setPersistence(window.auth, remember ? window.browserLocalPersistence : window.browserSessionPersistence);
            
            await window.signInWithEmailAndPassword(window.auth, email, pass);
            
            showMsg("Đăng nhập thành công!", "success");
            localStorage.setItem("theme", "light");
            setTimeout(() => window.location.href = "index.html", 1000);
        } catch (e) {
            showMsg("Lỗi: " + e.message, "error");
            setLoading(false);
        }
    }

    async function registerUser() {
        const email = document.getElementById("regEmail").value.trim();
        const pass = document.getElementById("regPassword").value;
        const confirm = document.getElementById("regConfirmPassword").value;
        
        if (!email || !pass) return showMsg("Thiếu thông tin!", "error");
        if (pass !== confirm) return showMsg("Mật khẩu không khớp!", "error");
        if (pass.length < 6) return showMsg("Mật khẩu quá ngắn!", "error");

        setLoading(true);
        try {
            await window.createUserWithEmailAndPassword(window.auth, email, pass);
            showMsg("Đăng ký thành công! Đang vào...", "success");
            localStorage.setItem("theme", "light");
            setTimeout(() => window.location.href = "index.html", 1500);
        } catch (e) {
            let err = e.message;
            if(e.code === 'auth/email-already-in-use') err = "Email đã tồn tại!";
            showMsg(err, "error");
            setLoading(false);
        }
    }

    async function loginWithGoogle() {
        try {
            await window.signInWithPopup(window.auth, new window.GoogleAuthProvider());
            window.location.href = "index.html";
        } catch(e) { showMsg("Lỗi Google: " + e.message, "error"); }
    }

    async function loginWithFacebook() {
        try {
            await window.signInWithPopup(window.auth, new window.FacebookAuthProvider());
            window.location.href = "index.html";
        } catch(e) { showMsg("Lỗi Facebook: " + e.message, "error"); }
    }

    const styleSheet = document.createElement("style");
    styleSheet.innerText = "@keyframes spin {0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);}}";
    document.head.appendChild(styleSheet);
</script>

</body>
</html>
