<!-- ==========================================
     DATA MANAGEMENT UI COMPONENT
     Thêm vào file index.html trong LSTM view
     ========================================== -->

<!-- Thêm section này vào trong lstm-view, trước phần training -->

<div class="data-management-section">
    <h3>📁 Quản lý dữ liệu huấn luyện</h3>
    
    <div class="data-controls-grid">
        <!-- Tải dữ liệu từ Firebase -->
        <div class="data-control-card">
            <h4><i class="fas fa-database"></i> Tải từ Firebase</h4>
            <div class="form-group">
                <label>Số lượng mẫu:</label>
                <select id="dataLimitSelect" class="glass-input">
                    <option value="50">50 mẫu gần nhất</option>
                    <option value="100">100 mẫu gần nhất</option>
                    <option value="200" selected>200 mẫu gần nhất</option>
                    <option value="500">500 mẫu gần nhất</option>
                    <option value="1000">1000 mẫu gần nhất</option>
                </select>
            </div>
            <button class="btn-primary" onclick="loadFirebaseData()">
                <i class="fas fa-download"></i> Tải dữ liệu
            </button>
        </div>

        <!-- Tải theo khoảng thời gian -->
        <div class="data-control-card">
            <h4><i class="fas fa-calendar-alt"></i> Theo khoảng thời gian</h4>
            <div class="form-group">
                <label>Từ ngày:</label>
                <input type="datetime-local" id="startDate" class="glass-input">
            </div>
            <div class="form-group">
                <label>Đến ngày:</label>
                <input type="datetime-local" id="endDate" class="glass-input">
            </div>
            <button class="btn-primary" onclick="loadDataByTimeRange()">
                <i class="fas fa-search"></i> Lọc dữ liệu
            </button>
        </div>

        <!-- Tải N ngày gần nhất -->
        <div class="data-control-card">
            <h4><i class="fas fa-clock"></i> N ngày gần nhất</h4>
            <div class="form-group">
                <label>Số ngày:</label>
                <select id="daysSelect" class="glass-input">
                    <option value="1">1 ngày</option>
                    <option value="3">3 ngày</option>
                    <option value="7" selected>7 ngày</option>
                    <option value="14">14 ngày</option>
                    <option value="30">30 ngày</option>
                </select>
            </div>
            <button class="btn-primary" onclick="loadLastNDaysData()">
                <i class="fas fa-calendar-check"></i> Tải dữ liệu
            </button>
        </div>

        <!-- Import/Export -->
        <div class="data-control-card">
            <h4><i class="fas fa-exchange-alt"></i> Import/Export</h4>
            <input type="file" id="dataFileInput" accept=".json" style="display: none;" onchange="handleDataImport(this)">
            <button class="btn-primary" onclick="document.getElementById('dataFileInput').click()">
                <i class="fas fa-file-upload"></i> Import JSON
            </button>
            <button class="btn-primary" onclick="handleDataExport()" style="margin-top: 10px;">
                <i class="fas fa-file-download"></i> Export JSON
            </button>
        </div>
    </div>

    <!-- Thống kê dữ liệu -->
    <div class="data-stats-card">
        <h4>📊 Thống kê dữ liệu hiện tại</h4>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Tổng số mẫu:</span>
                <span class="stat-value" id="totalSamples">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Khoảng thời gian:</span>
                <span class="stat-value" id="timeRange">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Nhiệt độ TB:</span>
                <span class="stat-value" id="avgTemp">--°C</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Độ ẩm TB:</span>
                <span class="stat-value" id="avgHum">--%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Khói TB:</span>
                <span class="stat-value" id="avgSmoke">-- PPM</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Chất lượng:</span>
                <span class="stat-value" id="dataQuality">--</span>
            </div>
        </div>
    </div>

    <!-- Xem trước dữ liệu -->
    <div class="data-preview-card">
        <h4>📈 Xem trước dữ liệu</h4>
        <div class="chart-wrapper">
            <canvas id="dataPreviewChart"></canvas>
        </div>
    </div>

    <!-- Tùy chọn làm sạch dữ liệu -->
    <div class="data-cleaning-card">
        <h4>🧹 Làm sạch dữ liệu</h4>
        <div class="cleaning-options">
            <label class="checkbox-label">
                <input type="checkbox" id="removeOutliers" checked>
                <span>Loại bỏ outliers (giá trị ngoại lai)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="smoothData">
                <span>Làm mượt dữ liệu (moving average)</span>
            </label>
        </div>
        <button class="btn-primary" onclick="applyDataCleaning()">
            <i class="fas fa-broom"></i> Áp dụng
        </button>
    </div>
</div>

<script>
// ===== HANDLER FUNCTIONS =====

async function loadFirebaseData() {
    const limit = parseInt(document.getElementById('dataLimitSelect').value);
    
    try {
        addTrainingLog(`🔄 Đang tải ${limit} mẫu từ Firebase...`);
        const data = await fetchFirebaseData(limit);
        updateDataStats(data);
        visualizeTrainingData(data);
        addTrainingLog(`✅ Đã tải thành công ${data.length} mẫu`);
    } catch (error) {
        addTrainingLog(`❌ Lỗi: ${error.message}`);
        alert('Lỗi khi tải dữ liệu từ Firebase!');
    }
}

async function loadDataByTimeRange() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    
    if (!startDate || !endDate) {
        alert('⚠️ Vui lòng chọn khoảng thời gian!');
        return;
    }
    
    try {
        addTrainingLog(`🔄 Đang lọc dữ liệu theo thời gian...`);
        const data = await fetchDataByTimeRange(startDate, endDate);
        updateDataStats(data);
        visualizeTrainingData(data);
        addTrainingLog(`✅ Đã tải ${data.length} mẫu trong khoảng thời gian`);
    } catch (error) {
        addTrainingLog(`❌ Lỗi: ${error.message}`);
        alert('Lỗi khi lọc dữ liệu: ' + error.message);
    }
}

async function loadLastNDaysData() {
    const days = parseInt(document.getElementById('daysSelect').value);
    
    try {
        addTrainingLog(`🔄 Đang tải dữ liệu ${days} ngày gần nhất...`);
        const data = await fetchLastNDays(days);
        updateDataStats(data);
        visualizeTrainingData(data);
        addTrainingLog(`✅ Đã tải ${data.length} mẫu từ ${days} ngày gần nhất`);
    } catch (error) {
        addTrainingLog(`❌ Lỗi: ${error.message}`);
        alert('Lỗi khi tải dữ liệu!');
    }
}

async function handleDataImport(input) {
    try {
        const data = await importTrainingData(input);
        updateDataStats(data);
        visualizeTrainingData(data);
        alert(`✅ Đã import thành công ${data.length} mẫu!`);
    } catch (error) {
        addTrainingLog(`❌ Lỗi import: ${error.message}`);
        alert('Lỗi khi import dữ liệu: ' + error.message);
    }
}

function handleDataExport() {
    if (!cachedTrainingData || cachedTrainingData.length === 0) {
        alert('⚠️ Chưa có dữ liệu để export! Hãy tải dữ liệu trước.');
        return;
    }
    
    exportTrainingData();
    alert('✅ Đã export dữ liệu thành công!');
}

function updateDataStats(data) {
    if (!data || data.length === 0) return;
    
    const stats = calculateDataStats(data);
    
    document.getElementById('totalSamples').textContent = data.length;
    
    const hours = ((stats.timeRange.end - stats.timeRange.start) / (1000 * 60 * 60)).toFixed(1);
    document.getElementById('timeRange').textContent = `${hours} giờ`;
    
    document.getElementById('avgTemp').textContent = stats.temp.avg.toFixed(1) + '°C';
    document.getElementById('avgHum').textContent = stats.hum.avg.toFixed(1) + '%';
    document.getElementById('avgSmoke').textContent = stats.smoke.avg.toFixed(0) + ' PPM';
    
    const quality = checkDataQuality(data);
    const qualityEl = document.getElementById('dataQuality');
    qualityEl.textContent = `${quality.score}/100`;
    qualityEl.style.color = quality.score >= 80 ? '#4ade80' : 
                           quality.score >= 60 ? '#fbbf24' : '#ef4444';
}

function applyDataCleaning() {
    if (!cachedTrainingData || cachedTrainingData.length === 0) {
        alert('⚠️ Chưa có dữ liệu để làm sạch!');
        return;
    }
    
    const removeOutliers = document.getElementById('removeOutliers').checked;
    const smoothing = document.getElementById('smoothData').checked;
    
    addTrainingLog('🧹 Đang làm sạch dữ liệu...');
    
    const cleaned = cleanData(cachedTrainingData, {
        removeOutliers,
        smoothing
    });
    
    cachedTrainingData = cleaned;
    updateDataStats(cleaned);
    visualizeTrainingData(cleaned);
    
    addTrainingLog(`✅ Đã làm sạch xong. Còn lại ${cleaned.length} mẫu`);
    alert('✅ Đã làm sạch dữ liệu thành công!');
}

// Khởi tạo giá trị mặc định cho date inputs
window.addEventListener('load', () => {
    const now = new Date();
    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
    
    document.getElementById('endDate').value = now.toISOString().slice(0, 16);
    document.getElementById('startDate').value = sevenDaysAgo.toISOString().slice(0, 16);
});
</script>
